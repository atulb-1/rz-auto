name: RZ Momentum Scanner

on:
  # Manual trigger with optional strategy override
  workflow_dispatch:
    inputs:
      strategies:
        description: 'Comma-separated strategies (leave empty to use default from secrets)'
        required: false
        type: string

  # ⚠️  THERE IS DELIBERATELY NO `schedule:` BLOCK. DO NOT ADD ONE.
  #
  # Both daily runs are fired by a Railway cron as workflow_dispatch:
  #     01:30 UTC = 07:00 IST   morning
  #     15:30 UTC = 21:00 IST   evening
  # One Railway service, cron `30 1,15 * * 1-5`. It lives in the
  # rotational_investing_system repo:
  #   scripts/trigger_rz_scan.py  +  railway.trigger.json
  #
  # WHY, measured rather than assumed. GitHub fires `schedule:` events late —
  # badly. The morning cron (00:55 UTC) produced runs *created* at 02:05–02:16
  # UTC, 70–80 minutes late; `created_at` is already post-delay. One Friday
  # evening cron (15:30 UTC) did not fire until 00:02 UTC the next day — 8.5
  # hours — and then failed. The runner queue was never the problem: it
  # measured 0s on every single run. It is GitHub's scheduler itself.
  #
  # That mattered downstream: the rebalance report runs 08:15 IST and consumes
  # these CSVs. A run created 02:16 plus ~16 min of scanning finished ~02:32,
  # leaving ~13 minutes of margin on a delay with no ceiling.
  #
  # A dispatched run is created the same SECOND it is requested (verified
  # repeatedly), so the start time means what it says.
  #
  # Re-adding any cron here would run the scan TWICE a day: once from Railway,
  # once from GitHub whenever it gets round to it — two concurrent RZone
  # logins on one account and two processes pushing CSVs to the same repo.

permissions:
  contents: read   # public repo only needs read; exports go to private repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Build config.ini from secrets
        env:
          RZ_UCC: ${{ secrets.RZONE_UCC }}
          RZ_PASSWORD: ${{ secrets.RZONE_PASSWORD }}
          RZ_TOTP_SECRET: ${{ secrets.RZONE_TOTP_SECRET }}
          RZ_STRATEGIES: ${{ inputs.strategies || secrets.RZONE_STRATEGIES }}
          RZ_DOWNLOAD_DIR: ./exports
          RZ_TG_BOT_TOKEN: ${{ secrets.RZONE_TG_BOT_TOKEN }}
          RZ_TG_CHAT_ID: ${{ secrets.RZONE_TG_CHAT_ID }}
          RZ_LOGIN_URL: ${{ secrets.RZONE_LOGIN_URL }}
        run: python ci/build_config.py

      - name: Run RZ Scanner (headless)
        run: python ci/rz_scanner_ci.py

      - name: Push exported CSVs to private repo
        if: always()
        env:
          EXPORTS_REPO_TOKEN: ${{ secrets.EXPORTS_REPO_TOKEN }}
        run: |
          # Check if any exports were produced
          if [ ! -d "exports" ] || [ -z "$(ls -A exports/ 2>/dev/null)" ]; then
            echo "No export files found — skipping push to private repo."
            exit 0
          fi

          # Clone the private exports repo using token
          git clone https://x-access-token:${EXPORTS_REPO_TOKEN}@github.com/atulb-1/rzone-exports.git private_exports

          # Copy today's exports into the private repo (date subfolder already created by scanner)
          cp -r exports/* private_exports/

          # Commit and push
          cd private_exports
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No new files to commit to private repo."
          else
            git commit -m "📊 Scan exports $(date +'%d-%m-%Y') — run #${{ github.run_number }}"
            git push
            echo "Exports pushed to private repo successfully."
          fi

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: debug-screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up secrets
        if: always()
        run: rm -f config.ini
