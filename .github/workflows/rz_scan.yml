name: RZ Momentum Scanner

on:
  # Manual trigger with optional strategy override
  workflow_dispatch:
    inputs:
      strategies:
        description: 'Comma-separated strategies (leave empty to use default from secrets)'
        required: false
        type: string

  # Evening scan only (Monday–Friday): 9:00 PM IST = 3:30 PM UTC.
  # It feeds the NEXT morning's rebalance report, so it has ~11h of slack and
  # GitHub's scheduler being late does not matter here.
  #
  # THE MORNING SCAN IS NO LONGER SCHEDULED HERE — do not add it back.
  # GitHub was firing this `schedule:` block 70–80 minutes late: a 00:55 UTC
  # cron produced runs *created* at 02:05–02:16 UTC, and with ~16 min of
  # scanning that left the downstream 08:15 IST rebalance report roughly 13
  # minutes of margin, on a delay with no ceiling. Runner queue was never the
  # problem — it measured 0s on every run.
  #
  # The morning run is now a workflow_dispatch fired by a Railway cron at
  # 01:30 UTC = 07:00 IST, which starts within a second of being asked.
  # Trigger lives in the rotational_investing_system repo:
  #   scripts/trigger_rz_scan.py  +  railway.trigger.json
  # Re-adding a morning cron here would run the scan TWICE every weekday.
  schedule:
    - cron: '30 15 * * 1-5'

permissions:
  contents: read   # public repo only needs read; exports go to private repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Build config.ini from secrets
        env:
          RZ_UCC: ${{ secrets.RZONE_UCC }}
          RZ_PASSWORD: ${{ secrets.RZONE_PASSWORD }}
          RZ_TOTP_SECRET: ${{ secrets.RZONE_TOTP_SECRET }}
          RZ_STRATEGIES: ${{ inputs.strategies || secrets.RZONE_STRATEGIES }}
          RZ_DOWNLOAD_DIR: ./exports
          RZ_TG_BOT_TOKEN: ${{ secrets.RZONE_TG_BOT_TOKEN }}
          RZ_TG_CHAT_ID: ${{ secrets.RZONE_TG_CHAT_ID }}
          RZ_LOGIN_URL: ${{ secrets.RZONE_LOGIN_URL }}
        run: python ci/build_config.py

      - name: Run RZ Scanner (headless)
        run: python ci/rz_scanner_ci.py

      - name: Push exported CSVs to private repo
        if: always()
        env:
          EXPORTS_REPO_TOKEN: ${{ secrets.EXPORTS_REPO_TOKEN }}
        run: |
          # Check if any exports were produced
          if [ ! -d "exports" ] || [ -z "$(ls -A exports/ 2>/dev/null)" ]; then
            echo "No export files found — skipping push to private repo."
            exit 0
          fi

          # Clone the private exports repo using token
          git clone https://x-access-token:${EXPORTS_REPO_TOKEN}@github.com/atulb-1/rzone-exports.git private_exports

          # Copy today's exports into the private repo (date subfolder already created by scanner)
          cp -r exports/* private_exports/

          # Commit and push
          cd private_exports
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No new files to commit to private repo."
          else
            git commit -m "📊 Scan exports $(date +'%d-%m-%Y') — run #${{ github.run_number }}"
            git push
            echo "Exports pushed to private repo successfully."
          fi

      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: debug-screenshots-${{ github.run_number }}
          path: screenshots/
          retention-days: 30
          if-no-files-found: ignore

      - name: Clean up secrets
        if: always()
        run: rm -f config.ini
